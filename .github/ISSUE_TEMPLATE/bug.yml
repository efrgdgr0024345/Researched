name: Bug report
about: Report a reproducible defect
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest safe example. Do not attach private research papers or API keys.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: PHP version, browser, phone/desktop, commit SHA
  - type: dropdown
    id: integrity
    attributes:
      label: Did this affect original ideas, hashes, sources, or audit history?
      options: [No, Yes, Unsure]
    validations:
      required: true
