name: One-time project bootstrap

on:
  push:
    branches: [codex/bootstrap-idea-workbench]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  extract-project:
    if: github.repository_owner == 'efrgdgr0024345'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: codex/bootstrap-idea-workbench
          fetch-depth: 0

      - name: Extract verified project tree
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/archive.part00a \
            .bootstrap/archive.part00b0 \
            .bootstrap/archive.part00b1 \
            .bootstrap/archive.part00c0 \
            .bootstrap/archive.part00c1 \
            .bootstrap/archive.part01 \
            .bootstrap/archive.part02 \
            .bootstrap/archive.part03 \
            .bootstrap/archive.part04 \
            > /tmp/researched-project.tar.gz.b64
          echo '56b8aea44df8149b1e66b476993053931f18780d5301fe9568bc4db5ced83875  /tmp/researched-project.tar.gz.b64' | sha256sum -c -
          base64 --decode /tmp/researched-project.tar.gz.b64 > /tmp/researched-project.tar.gz
          echo '7cc23025cef0ac188a6973608a50de9b847e71b2ad8e9a789bf27d014becc7ba  /tmp/researched-project.tar.gz' | sha256sum -c -
          tar -xzf /tmp/researched-project.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-project.yml
          bash scripts/check.sh

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Project tree already matches the archive."
            exit 0
          fi
          git commit -m "feat: add Codex-ready idea research workbench"
          git push origin HEAD:codex/bootstrap-idea-workbench
